name: nas-telegram-inbox
services:
  web:
    build: .
    image: nas-telegram-inbox:local
    restart: unless-stopped
    # install.sh generates user, ports and download mounts in compose.override.yaml.
    user: "65532:65532"
    environment:
      DATA_DIR: /data
      ACCESS_TOKEN_FILE: /run/secrets/access_token
      DOWNLOAD_ROOTS: /downloads
      TZ: UTC
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/access_token
        target: /run/secrets/access_token
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
